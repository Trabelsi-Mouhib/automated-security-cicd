name: DevSecOps Compliance Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Restrict default GITHUB_TOKEN permissions to read-only
permissions:
  contents: read

jobs:
  # JOB 1: Secret Scanning
  secret-scanning:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS Secret Scan
        # Pinned to fixed release version to avoid supply-chain vulnerability
        uses: trufflesecurity/trufflehog@v3.88.0

  # JOB 2: Static Application Security Testing (SAST)
  sast-scanning:
    name: Static Code Analysis (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Semgrep SAST
        run: |
          python -m pip install semgrep
          semgrep scan --config p/owasp-top-ten --error

  # JOB 3: Software Composition Analysis (SCA)
  sca-scanning:
    name: Dependency Scanning (Snyk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Snyk to check for vulnerabilities
        # Pinned to fixed release tag instead of mutable '@master'
        uses: snyk/actions/python@0.4.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}